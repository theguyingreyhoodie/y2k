<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dff5ff" />
    <meta name="description" content="Make your photos hopelessly Y2K: Frutiger Aero gloss, cybercore chrome, pixel twins, stickers and chrome text, edited in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@500;700&family=Press+Start+2P&family=UnifrakturCook:wght@700&family=Unbounded:wght@500;600;700;800;900&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem("y2k-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Y2KEDIT · make your photos hopelessly Y2K</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
